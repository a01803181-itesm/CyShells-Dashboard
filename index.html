<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="media_sources/cy_shell_shortened_logo.png">
        <title>CyShells Inicio de Sesión</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            primary: '#44A4C7',
                            secondary: '#000814'
                        }
                    }
                }
            }
        </script>
    </head>
    <body class="bg-secondary flex items-center justify-center h-screen font-sans">
        <div class="p-4 w-full max-w-md">
            <img src="media_sources/cy_shell_full_logo.png" alt="CyShells Logo">
            <h2 class="text-xl text-white font-bold text-center mb-6">¡Hola de Nuevo!</h2>
            <form id="login-form" class="space-y-8">
                <div>
                    <label class="block text-sm font-medium text-white">Correo Electrónico</label>
                    <input type="email" id="email" class="mt-1 block w-full px-3 py-2 border border-border rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary" required>
                </div>
                <dv>
                    <label class="block text-sm font-medium text-white">Contraseña</label>
                    <input type="password" id="password" class="mt-1 block w-full px-3 py-2 border border-border rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary" required>
                </dv>
                <div>
                    <p id="feedback-message" class="text-sm text-white text-center font-medium hidden">Error Label</p>
                </div>
                <div class="flex items-center justify-center">
                    <a href="#" id="forgot-password" class="text-sm text-primary hover:underline">Recuperar contraseña</a>
                </div>
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-white bg-primary hover:opacity-90 font-medium">
                    Acceder
                </button>
            </form>
        </div>
        <script type="module" src="auth.js"></script>
    </body>
</html>
